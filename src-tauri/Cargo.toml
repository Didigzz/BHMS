[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desktop fallback for receipt export decodes the base64 PNG (Android uses the
# Kotlin GallerySaver plugin instead). Already in the tree at 0.22.1, so no new
# compile.
base64 = "0.22"

# Migration self-heal: rewrite stale `_sqlx_migrations` checksums in place so a
# database created by an older build (whose migration SQL differed) opens again.
# sha2 is already in the tree (sqlx) and rusqlite reuses the bundled
# libsqlite3-sys, so neither adds a second SQLite build.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

# Desktop only. A second launch must focus the running window instead of
# starting another copy: two copies hold the same database open, and on Windows
# that makes the file swap a restore needs fail with "Access is denied". The
# plugin is desktop-only, so it is kept out of the mobile dependency graph
# entirely.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

